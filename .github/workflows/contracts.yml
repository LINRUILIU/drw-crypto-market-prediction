name: Data contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install lightweight test dependencies
        run: python -m pip install numpy pandas PyYAML matplotlib
      - name: Validate data contracts and synthetic pipeline
        run: python -m unittest discover -s tests -v
