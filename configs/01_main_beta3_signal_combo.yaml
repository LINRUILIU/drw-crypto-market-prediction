  spearman_weights: [0.00, 0.025, 0.05, 0.075, 0.10, 0.125, 0.15, 0.175, 0.20, 0.225, 0.25]
  min_total_signal_weight: 0.15
  max_total_signal_weight: 0.35
  require_positive_residual: true
  require_positive_spearman: true

selection:
  max_selected_submissions: 3
  holdout_tolerance: 0.0015
  max_std_ratio_current_best: 1.15
  valid_bins: 4

output:
  run_dir: runs/01_main/beta3_signal_combo
