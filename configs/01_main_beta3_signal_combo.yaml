      weight: 0.20
      public_score: 0.05835
      private_score: 0.09929
  spearman_top50:
    family: spearman
    signal_submission_path: submissions/01_main/beta3_new_feature_signals/signals/submission_spearman_top50_ridge.csv
    valid_prediction_path: runs/01_main/beta3_new_feature_signals/valid_predictions/valid_spearman_top50_ridge.csv
