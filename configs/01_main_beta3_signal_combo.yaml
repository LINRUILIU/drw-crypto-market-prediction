  beta2_top100_alpha50:
    valid_prediction_path: runs/01_main/beta2_high_alpha_fine/valid_predictions/valid_top100_alpha50.csv
  residual_pearson_top100:
    family: residual
    signal_submission_path: submissions/01_main/beta3_new_feature_signals/signals/submission_residual_pearson_top100_ridge.csv
    valid_prediction_path: runs/01_main/beta3_new_feature_signals/valid_predictions/valid_residual_pearson_top100_ridge.csv
