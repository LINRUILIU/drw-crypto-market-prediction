data:
  raw_dir: data/raw
  train_file:
  test_file:
  sample_submission_file:
  target_col: label
  id_col:
  validation_fraction: 0.2
  drop_columns: []

preprocessing:
  numeric_only: true
  missing_fill: median
  standardize: true

current_best:
  name: beta3_spearman_weight_micro
  private_score: 0.10003
  components:
    - name: top50_alpha200000
      selected_features_path: runs/01_main/pearson_topk/selected_features_top50.txt
      alpha: 200000
      weight: 0.3825
    - name: top100_alpha50
      selected_features_path: runs/01_main/pearson_topk/selected_features_top100.txt
      alpha: 50
      weight: 0.3825
    - name: spearman_top50_alpha50000
      selected_features_path: runs/01_main/beta3_new_feature_signals/selected_features_spearman_top50.txt
      alpha: 50000
      weight: 0.235

features:
  medoid_features_path: runs/01_main/beta4_medoid/selected_features_medoid_t0p6.txt

cv:
  n_groups: 6
  gap: 1

xgboost:
  n_estimators: 800
  learning_rate: 0.03
  max_depth: 5
  subsample: 0.85
  colsample_bytree: 0.85
  reg_lambda: 1.0
  early_stopping_rounds: 80

stable_selection:
  fold_top_n: 20
  min_fold_appearances: 4
  fill_to_n: 20

ridge:
  alphas: [10, 50, 100, 300, 1000, 3000, 10000, 50000, 200000]

blend:
  signal_weights: [0.05, 0.10, 0.15, 0.20, 0.25]
  holdout_tolerance: 0.003
  max_std_ratio_current_best: 1.20
  max_selected_submissions: 3

output:
  run_dir: runs/01_main/beta4_shap_stable
  submission_dir: submissions/01_main/beta4_shap_stable
  prediction_col: prediction
