data:
  raw_dir: data/raw
  train_file:
  test_file:
  sample_submission_file:
  target_col: label
  id_col:
  validation_fraction: 0.2
  drop_columns: []

preprocessing:
  numeric_only: true
  missing_fill: median
  standardize: true

components:
  top50:
    selected_features_path: runs/01_main/pearson_topk/selected_features_top50.txt
    alphas: [75000, 100000, 125000, 150000, 175000, 200000]
  top100:
    selected_features_path: runs/01_main/pearson_topk/selected_features_top100.txt
    alphas: [50, 75, 100, 125, 150, 175, 200, 250, 300]

ridge:
  alphas: [1000]

blend:
  top50_weights: [0.50, 0.5125, 0.525, 0.5375, 0.55, 0.5625]
  current_best:
    name: beta2_high_alpha_current_weight_best
    submission_path: submissions/01_main/beta2_high_alpha_refine/submission_blend_t50a100000_t100a150_w50_0p525_w100_0p475.csv
    private_score: 0.09619
    top50_weight: 0.525
    top50_alpha: 100000
    top100_alpha: 150
  alpha_ensemble:
    top50_alphas: [75000, 100000, 125000, 150000]
    top100_alphas: [75, 100, 125, 150, 175]
    top50_weight: 0.525

selection:
  stable_corr_min: 0.98
  stable_std_ratio_max: 1.20
  low_corr_holdout_tolerance: 0.003

output:
  run_dir: runs/01_main/beta2_high_alpha_fine
  submission_dir: submissions/01_main/beta2_high_alpha_fine
  prediction_col: prediction
