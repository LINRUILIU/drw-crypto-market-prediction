data:
  raw_dir: data/raw
  train_file:
  test_file:
  sample_submission_file:
  target_col: label
  id_col:
  drop_columns: []
  validation_fraction: 0.2

preprocessing:
  numeric_only: true
  missing_fill: median
  standardize: true

feature_selection:
  stable_top_k: 50
  signal_top_k: [200, 300]

rolling:
  folds:
    - name: fold_50_60
      train_start: 0.0
      train_end: 0.5
      valid_start: 0.5
      valid_end: 0.6
    - name: fold_60_70
      train_start: 0.0
      train_end: 0.6
      valid_start: 0.6
      valid_end: 0.7
    - name: fold_70_80
      train_start: 0.0
      train_end: 0.7
      valid_start: 0.7
      valid_end: 0.8
    - name: fold_80_90
      train_start: 0.0
      train_end: 0.8
      valid_start: 0.8
      valid_end: 0.9

holdout_validation:
  enabled: true
  name: holdout_80_100
  train_start: 0.0
  train_end: 0.8
  valid_start: 0.8
  valid_end: 1.0

models:
  ridge:
    alphas: [0.1, 1.0, 10.0, 100.0, 1000.0]
  lightgbm:
    n_estimators: 1200
    learning_rate: 0.03
    num_leaves: 63
    subsample: 0.85
    colsample_bytree: 0.85
    reg_alpha: 0.0
    reg_lambda: 1.0
    early_stopping_rounds: 100

blend:
  step: 0.05
  min_stable_weight: 0.70
  max_signal_weight: 0.30
  stability_penalty: 1.0
  min_fold_weight: 0.25
  save_top_n: 1000

output:
  run_dir: runs/01_main/stability_blend
  submission_dir: submissions/01_main/stability_blend
  prediction_col:
